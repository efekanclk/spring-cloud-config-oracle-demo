<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Property</title>
    <!-- Tasarım için Bootstrap kütüphanesi -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                    <h5 class="fw-bold mb-0">Add New Property</h5>
                </div>
                <div class="card-body p-4">
                    <!-- Form verileri /web/config/save adresine POST edilecek -->
                    <form th:action="@{/web/config/save}" th:object="${property}" method="post">

                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Application</label>
                            <input type="text" class="form-control" th:field="*{application}" placeholder="örn: myapp" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Profile</label>
                            <input type="text" class="form-control" th:field="*{profile}" placeholder="örn: dev" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Label</label>
                            <input type="text" class="form-control" th:field="*{label}" placeholder="örn: main" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Key</label>
                            <input type="text" class="form-control" th:field="*{key}" placeholder="örn: app.name" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Value</label>
                            <input type="text" class="form-control" th:field="*{value}" placeholder="örn: Değer" required>
                        </div>

                        <div class="d-flex justify-content-end mt-4 pt-2 border-top">
                            <a th:href="@{/web/config}" class="btn btn-light border px-4 me-2">Cancel</a>
                            <button type="submit" class="btn btn-success px-4">Save</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
