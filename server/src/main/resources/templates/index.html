<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Config Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold mb-0">Configuration Management</h3>
        <div>
            <a th:href="@{/web/config/audit}" class="btn btn-outline-dark px-3 fw-semibold shadow-sm">View Audit History</a>
        </div>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead class="table-light text-muted">
                    <tr>
                        <th class="fw-semibold">Application</th>
                        <th class="fw-semibold">Profile</th>
                        <th class="fw-semibold">Label</th>
                        <th class="fw-semibold">Key</th>
                        <th class="fw-semibold">Value</th>
                        <th class="fw-semibold">Created At</th>
                        <th class="fw-semibold">Updated At</th>
                        <th class="text-center fw-semibold align-middle">
                            <a th:href="@{/web/config/insert}" class="btn btn-success px-3 fw-bold mb-2 shadow-sm" style="font-size: 13px;">+ Insert</a>
                            <div class="text-uppercase small">Actions</div>
                        </th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="prop : ${properties}">
                        <td th:text="${prop.application}"></td>
                        <td th:text="${prop.profile}"></td>
                        <td th:text="${prop.label}"></td>
                        <td th:text="${prop.key}"></td>
                        <td th:text="${prop.value}"></td>
                        <td th:text="${#temporals.format(prop.createdAt, 'dd-MM-yyyy HH:mm')}"></td>
                        <td th:text="${#temporals.format(prop.updatedAt, 'dd-MM-yyyy HH:mm')}"></td>
                        <td class="text-center">
                            <a th:href="@{/web/config/edit/{id}(id=${prop.id})}" class="btn btn-sm btn-outline-primary px-3 me-2">Edit</a>
                            <form th:action="@{/web/config/delete/{id}(id=${prop.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-sm btn-outline-danger px-3" onclick="return confirm('Bu kaydı silmek istediğine emin misin?');">Delete</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
